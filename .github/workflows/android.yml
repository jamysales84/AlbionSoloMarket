name: Build Android Beta V0.4
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.11.1'}
   - run: gradle testDebugUnitTest
   - run: gradle assembleDebug
   - run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AlbionSM-V0.4-debug.apk
   - uses: actions/upload-artifact@v4
     with: {name: AlbionSM-V0.4-debug-apk, path: app/build/outputs/apk/debug/AlbionSM-V0.4-debug.apk}
